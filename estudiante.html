<script>
const areas=['Matemáticas','Comprensión Lectora','Ciencias Sociales','Ciencias Naturales','Inglés'];
const comps={
 'Matemáticas':['Interpretación y representación','Argumentación','Formulación y ejecución'],
 'Comprensión Lectora':['Identifica y entiende','Comprender y articular','Reflexiona y evalúa'],
 'Ciencias Sociales':['Pensamiento social','Análisis de perspectivas','Pensamiento reflexivo'],
 'Ciencias Naturales':['Uso comprensivo del conocimiento','Explicación de fenómenos','Indagación'],
 'Inglés':['Conocimiento lexical','Conocimiento pragmático','Comprensión comunicativa']
};
let questions=[];
const SUPABASE_URL="https://quwucaktidvlpfzzgnov.supabase.co";
const SUPABASE_KEY="sb_publishable_yGmc235j8hupPZ5nmZ43pw_tCb86k9q";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let student='Estudiante',studentPdfs={},pdfUrl='',pdfName='',videos={},toastTimer;
let estudianteReal=null, resultadoReal=null, simulacroReal=null, puestoReal=null, cohorteReal=0, percentilReal=null;
async function initEstudiante(){
  const sesion=JSON.parse(sessionStorage.getItem('estudiante')||'null');
  if(!sesion){window.location.href='index.html';return}
  const {data,error}=await supabaseClient.from('estudiantes').select('*').eq('id',sesion.id).single();
  if(error||!data){alert('No se pudo cargar tu información. Vuelve a iniciar sesión.');window.location.href='index.html';return}
  estudianteReal=data;
  student=data.nombre;
  await cargarDatosReales(data);
  renderAll();
  $('#userName').textContent=data.nombre;
  $('#avatar').textContent=data.nombre.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
}
function normText(v){return String(v??'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function qNumber(q){const n=Number(q?.numero);if(Number.isFinite(n)&&n)return n;const m=String(q?.pregunta_codigo||'').match(/\d+/);return m?Number(m[0]):0}
function canonicalArea(raw){const a=normText(raw);if(a.includes('MAT'))return areas[0];if(a.includes('LECT')||a.includes('COMPRENSION'))return areas[1];if(a.includes('SOC'))return areas[2];if(a.includes('NAT')||a==='CN'||a.includes('CIENCIAS'))return areas[3];if(a.includes('ING'))return areas[4];return raw||'Sin área'}
function codeFor(v){return normText(v).replace(/\s/g,'')}
function questionTotals(){const total=questions.length,correct=questions.filter(q=>q.status==='correct').length,miss=questions.filter(q=>q.status==='incorrect').length,blanks=questions.filter(q=>q.status==='blank').length,multiple=questions.filter(q=>q.status==='multiple').length;const byArea=areas.map(area=>{const qs=questions.filter(q=>q.area===area),n=qs.filter(q=>q.status==='correct').length;return {area,n,total:qs.length,pct:qs.length?Math.round(n*100/qs.length):null}}).filter(x=>x.total);const ranking=[...byArea].filter(x=>x.pct!=null).sort((a,b)=>b.pct-a.pct);return {total,correct,miss,blanks,multiple,critical:questions.filter(q=>q.status!=='correct'),byArea,bestArea:ranking[0]?.area,bestPct:ranking[0]?.pct}}
function scoreFromAnswers(studentAnswers, questionRows){const byArea={};areas.forEach(a=>byArea[a]={right:0,total:0});questionRows.forEach(q=>{const a=canonicalArea(q.area||q.area_corta);if(byArea[a])byArea[a].total++});const qByCode=new Map();questionRows.forEach(q=>{qByCode.set(codeFor(q.pregunta_codigo),q);qByCode.set(String(qNumber(q)),q)});(studentAnswers||[]).forEach(a=>{const digits=String(a.pregunta_codigo||'').match(/\d+/),q=qByCode.get(codeFor(a.pregunta_codigo))||qByCode.get(digits?digits[0]:'');if(!q)return;const area=canonicalArea(q.area||q.area_corta);if(!byArea[area])return;const marked=codeFor(a.respuesta_marcada),key=codeFor(q.respuesta_correcta);const correct=typeof a.es_correcta==='boolean'?a.es_correcta:(String(a.es_correcta)==='1'||String(a.es_correcta).toLowerCase()==='true'||(key&&marked===key));if(correct)byArea[area].right++});const p=area=>byArea[area].total?byArea[area].right/byArea[area].total*100:0;const score=Math.round(((p(areas[0])*3+p(areas[1])*3+p(areas[2])*3+p(areas[3])*3+p(areas[4]))/13)*5);return {score,byArea}}
function matchedQuestionCount(studentAnswers, questionRows){
  const byCode=new Map();
  questionRows.forEach(q=>{byCode.set(codeFor(q.pregunta_codigo),q);byCode.set(String(qNumber(q)),q)});
  const matched=new Set();
  (studentAnswers||[]).forEach(a=>{
    const digits=String(a.pregunta_codigo||'').match(/\d+/);
    const q=byCode.get(codeFor(a.pregunta_codigo))||byCode.get(digits?digits[0]:'');
    if(q)matched.add(qNumber(q));
  });
  return matched.size;
}
async function cargarDatosReales(studentRow){
  const notice=$('#dataNotice');
  const {data:mine,error:mineError}=await supabaseClient.from('resultados_estudiante').select('id,estudiante_id,simulacro_id,curso,aciertos_totales,porcentaje_global,puntaje_global,nivel_global').eq('estudiante_id',studentRow.id);
  if(mineError)throw mineError;
  if(!mine||!mine.length){questions=[];resultadoReal=null;simulacroReal=null;puestoReal=null;cohorteReal=0;percentilReal=null;if(notice)notice.innerHTML='<b>Aún no hay resultados publicados para tu usuario.</b> Tu docente podrá asociar el simulacro cuando esté listo.';return}
  const chosen=mine[mine.length-1];

function selectQuestion(n){viewQuestion(n)}
function viewQuestion(n){navigate('answers');const row=[...document.querySelectorAll('#answerRows tr')].find(tr=>tr.querySelector('.qnum')?.textContent.includes(String(n).padStart(2,'0')));if(row){row.scrollIntoView({behavior:'smooth',block:'center'});row.style.outline='2px solid #2457d6';setTimeout(()=>row.style.outline='',1800)}}
function setStudent(name){if(student!==name){if(pdfUrl)studentPdfs[student]={url:pdfUrl,name:pdfName};student=name;const saved=studentPdfs[student];pdfUrl=saved?.url||'';pdfName=saved?.name||''}$('#studentSelect').value=name;$('#userName').textContent=name;$('#avatar').textContent=name.split(' ').map(x=>x[0]).join('');renderAll()}
function renderAll(){renderHome();renderAnswers();renderCritical();if($('#materials').classList.contains('active'))renderMaterials()}
function navigate(id){$$('.section').forEach(s=>s.classList.toggle('active',s.id===id));$$('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));$('#crumb').textContent=({home:'Mi progreso',answers:'Mi hoja de respuestas',critical:'Preguntas para revisar',materials:'Cargar PDF y videos'})[id]||'Mi espacio';$('#sidebar').classList.remove('open');if(id==='materials')renderMaterials();window.scrollTo({top:0,behavior:'smooth'})}
$$('.nav[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
$('#mobileToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
initEstudiante().catch(error=>{const notice=$('#dataNotice');if(notice)notice.innerHTML='<b>No fue posible cargar tus resultados.</b> Intenta actualizar la página o consulta a tu docente.';console.error('Error al cargar panel estudiante:',error)});
</script>
</body>
</html>
