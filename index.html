<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saber Más Preicfes · Acceso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#172b4d;--muted:#68778d;--line:#e5eaf1;--bg:#f4f7fb;--blue:#2457d6;--blue-dark:#1741b0;--teal:#078a80;--red:#d95b53;--pale:#eef3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;box-shadow:0 12px 34px rgba(26,47,87,.08)}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;text-align:center}
.brand img{width:56px;height:56px}
.brand h1{font-size:18px;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:16px}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--blue-dark)}
button:disabled{opacity:.6;cursor:default}
.error{background:#fff0ef;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none}
.error.show{display:block}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.secondary{background:var(--pale);color:var(--blue);border:1px solid var(--line)}
.secondary:hover{background:#e2ebff}
.note{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
</style>
<style id="visual-polish">
:root{--ink:#15294b;--muted:#65758d;--line:#e3eaf4;--bg:#f3f7fd;--blue:#2457d6;--blue-dark:#1741b0}
html{min-height:100%;background:radial-gradient(ellipse at 12% 12%,rgba(52,112,231,.11),transparent 35%),radial-gradient(ellipse at 90% 88%,rgba(7,138,128,.09),transparent 32%),var(--bg)}body{min-height:100vh} .card{max-width:420px;border-radius:22px;padding:clamp(26px,5vw,40px);box-shadow:0 22px 60px rgba(26,47,87,.12);border-color:rgba(220,229,242,.9)}.brand{margin-bottom:30px}.brand img{width:70px;height:70px;object-fit:contain}.brand h1{font-size:21px;letter-spacing:-.35px}.brand p{font-size:13px;line-height:1.5}.card form{margin-top:4px}label{font-weight:650;color:#40516d}input{min-height:46px;margin-bottom:17px;border-radius:11px;background:#fbfcff}input:focus{outline:3px solid #c6d5ff;outline-offset:1px}button{min-height:46px;border-radius:11px;font-weight:700;box-shadow:0 7px 15px rgba(36,87,214,.16)}button:hover{transform:translateY(-1px)}.secondary{box-shadow:none}.note{line-height:1.55}.error{line-height:1.45}
@media(max-width:480px){body{padding:14px}.card{padding:28px 22px;border-radius:18px}.brand img{width:62px;height:62px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="card">
  <div class="brand">
    <img src="saber-mas-preicfes-logo.png" alt="Saber Más Preicfes">
    <h1>Saber Más Preicfes</h1>
    <p>Ingresa con tu código de acceso</p>
  </div>
  <div class="error" id="errorBox"></div>
  <form id="loginForm">
    <label for="codigo">Código de acceso (estudiante)</label>
    <input id="codigo" placeholder="Ej: EST001" autocomplete="off" autofocus>
    <button type="submit" id="submitBtn">Ingresar</button>
  </form>
  <div class="divider">o</div>
  <button class="secondary" onclick="window.location.href='docente.html'">Soy docente o administrador</button>
  <p class="note">El acceso de docentes y administradores con correo y contraseña se activará en la siguiente etapa.</p>
</div>
<script>
const SUPABASE_URL="https://quwucaktidvlpfzzgnov.supabase.co";
const SUPABASE_KEY="sb_publishable_yGmc235j8hupPZ5nmZ43pw_tCb86k9q";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('loginForm');
const errorBox=document.getElementById('errorBox');
const submitBtn=document.getElementById('submitBtn');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBox.classList.remove('show');
  const codigo=document.getElementById('codigo').value.trim();
  if(!codigo){
    errorBox.textContent='Escribe tu código de acceso.';
    errorBox.classList.add('show');
    return;
  }
  submitBtn.disabled=true;
  submitBtn.textContent='Verificando…';
  const {data,error}=await supabaseClient
    .from('estudiantes')
    .select('*')
    .eq('codigo_acceso', codigo)
    .single();
  submitBtn.disabled=false;
  submitBtn.textContent='Ingresar';
  if(error || !data){
    errorBox.textContent='Código no válido. Verifica con tu docente.';
    errorBox.classList.add('show');
    return;
  }
  sessionStorage.setItem('estudiante', JSON.stringify(data));
  window.location.href='estudiante.html';
});
</script>
</body>
</html>
